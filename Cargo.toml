[workspace]
resolver = "2"
members = [
    "crates/embed_core",
    "crates/embed_router",
    "crates/llama_worker",
    "crates/ocr_core",
    "crates/video_frames",
    "crates/caption_core",
    "crates/local_media_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/joopererer/local-media-ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
