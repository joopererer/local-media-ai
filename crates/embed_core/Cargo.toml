[package]
name = "embed_core"
version.workspace = true
edition.workspace = true
description = "App-agnostic EmbeddingGemma 2 embedding (text/image vectors). No app dependencies."

[lib]
crate-type = ["lib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
thiserror.workspace = true
hex = "0.4.3"
# Quantized ONNX export; the ORT library is loaded dynamically from an absolute path.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4.3"
