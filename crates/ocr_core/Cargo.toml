[package]
name = "ocr_core"
version.workspace = true
edition.workspace = true
description = "App-agnostic OCR (image -> text + line boxes). Engine-replaceable."

[lib]
crate-type = ["lib"]

[dependencies]
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
